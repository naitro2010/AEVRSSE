name: AEVRSSE
on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      versionString:
        description: 'Version String'
        type: string
env:
  BUILD_TYPE: Release
  PROJECT_NAME: AEVRSSE
  PROJECT_LONG_NAME: AEVRSSE
jobs:
  build-skse:
    runs-on: windows-2022
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with: 
          submodules: recursive
      - name: Get CMake
        uses: lukka/get-cmake@v3.27.4
        with:
          cmakeVersion: "3.27.4"
      - name: vcpkg cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "b02e341c927f16d991edbd915d8ea43eac52096c"        
      - name: Run CMake
        uses: lukka/run-cmake@v10
        with:
          cmakeListsTxtPath: ${{ github.workspace }}/CMakeLists.txt
          configurePreset: default
          configurePresetAdditionalArgs: "['-DCMAKE_TOOLCHAIN_FILE:STRING=C:/vcpkg/scripts/buildsystems/vcpkg.cmake','-DCMAKE_POLICY_VERSION_MINIMUM=3.5']"
          buildPreset: release
          buildPresetAdditionalArgs: "['--config Release','-DCMAKE_POLICY_VERSION_MINIMUM=3.5']"
      - name: Move binaries
        run: |
          cd ${{github.workspace}}/build/bin/release
          mkdir artifacts
          cd artifacts
          mkdir SKSE
          mkdir SKSE/Plugins
          mkdir SKSE/CustomConsole
          move ../AEVRSSE.dll SKSE/Plugins
          move ../AEVRSSE.pdb SKSE/Plugins
          mkdir Scripts
          mkdir Scripts/Source
          copy ${{github.workspace}}/dist/Data/Scripts/*.pex Scripts
          copy ${{github.workspace}}/dist/Data/Scripts/Source/*.psc Scripts/Source
          copy ${{github.workspace}}/dist/Data/SKSE/CustomConsole/*.yaml SKSE/CustomConsole
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with: 
          name: AEVRSSE
          path: build/bin/release/artifacts
          retention-days: 90